<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Солнышко 🌞</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; }
body {
  display:flex; flex-direction:column; align-items:center;
  font-family:'Segoe UI',system-ui,sans-serif; color:#fff;
  background:radial-gradient(ellipse at 50% 12%, #33436f 0%, #1b2138 45%, #0d1024 100%);
  overflow:hidden; transition:background 1.2s; user-select:none;
}
body.night { background:radial-gradient(ellipse at 50% 12%, #131a33 0%, #0a0d1d 55%, #05060f 100%); }
.stars { position:fixed; inset:0; pointer-events:none; }
.star { position:absolute; background:#fff; border-radius:50%; animation:twinkle 3s infinite ease-in-out; }
@keyframes twinkle { 0%,100%{opacity:.15} 50%{opacity:.9} }

.ui { position:fixed; top:12px; z-index:100; width:44px; height:44px; border-radius:50%;
      border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.08);
      backdrop-filter:blur(10px); font-size:20px; cursor:pointer; }
#moonbtn { left:12px; } #fsbtn { right:12px; }

#scene { position:relative; height:42vh; min-height:250px; width:100%;
         perspective:900px; touch-action:none; overflow:hidden; }
#sun { position:absolute; width:170px; height:170px; transform:translate(-50%,-50%);
       cursor:grab; z-index:10; }
#sun:active { cursor:grabbing; }
#body { position:absolute; inset:0; animation:floaty 4.2s ease-in-out infinite; }
@keyframes floaty { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-12px) scale(1.02)} }

/* лучи — все на одном держателе, смещаться не могут */
#rays { position:absolute; inset:0; animation:spin 30s linear infinite; transition:opacity .6s; }
@keyframes spin { to{transform:rotate(360deg)} }
.ray { position:absolute; left:50%; top:50%; width:7px; height:32px; margin-left:-3.5px; border-radius:4px;
       background:linear-gradient(to top,#ffd97a,rgba(255,200,90,0));
       transform:rotate(var(--a)) translateY(-102px); animation:raypulse 2.4s infinite ease-in-out; }
@keyframes raypulse { 0%,100%{opacity:.55} 50%{opacity:1} }
body.moon #rays { opacity:0; pointer-events:none; }

/* 3D-сфера */
.ball { position:absolute; inset:0; border-radius:50%; transform:rotateY(-8deg);
  background:radial-gradient(circle at 33% 26%, #fff8cf 0%, #ffe98c 18%, #ffc63f 45%, #f79b22 75%, #d97a10 100%);
  box-shadow:0 18px 40px rgba(0,0,0,.35), 0 0 55px 18px rgba(255,190,80,.5),
             0 0 130px 55px rgba(255,150,50,.2),
             inset -20px -24px 44px rgba(150,55,0,.4), inset 12px 14px 30px rgba(255,255,220,.5);
  transition:box-shadow .5s, background .5s;
}
.ball::before { content:''; position:absolute; left:22%; top:12%; width:34%; height:26%; border-radius:50%;
  background:radial-gradient(rgba(255,255,255,.9), rgba(255,255,255,0)); filter:blur(6px); }
.crater { position:absolute; border-radius:50%; opacity:0; transition:opacity .6s;
  background:radial-gradient(circle at 35% 30%, #cdd7ea, #8d9bb5);
  box-shadow:inset 3px 4px 7px rgba(30,40,70,.55), inset -2px -2px 4px rgba(255,255,255,.25); }
body.moon .crater { opacity:1; }
.c1 { width:30px; height:30px; left:32px; top:38px; }
.c2 { width:18px; height:18px; left:86px; top:98px; }
.c3 { width:13px; height:13px; left:112px; top:50px; }
body.moon .ball {
  background:radial-gradient(circle at 33% 26%, #fdfdff 0%, #d3dcee 20%, #9aa8c4 55%, #667392 90%);
  box-shadow:0 18px 40px rgba(0,0,0,.5), 0 0 45px 14px rgba(170,195,255,.3),
             inset -20px -24px 44px rgba(20,30,60,.55), inset 12px 14px 30px rgba(255,255,255,.35);
}

/* лицо */
.face { position:absolute; inset:0; transition:transform .4s; }
.brow { position:absolute; top:46px; width:20px; height:5px; background:#6b2f00; border-radius:3px;
        opacity:0; transition:opacity .3s, transform .3s; }
.brow.l { left:40px; } .brow.r { right:40px; }
.eye { position:absolute; top:62px; width:15px; height:20px; border-radius:50%;
       background:#6b2f00; transition:all .2s; }
.eye.l { left:44px; } .eye.r { right:44px; }
.eye.closed { height:4px; border-radius:3px; }
.cheek { position:absolute; top:96px; width:18px; height:10px; border-radius:50%;
         background:rgba(255,120,80,.4); filter:blur(2px); transition:all .3s; }
.cheek.l { left:26px; } .cheek.r { right:26px; }
#mouth { position:absolute; top:102px; left:50%; transform:translateX(-50%);
         width:34px; height:15px; border:4px solid #6b2f00; border-top:none;
         border-radius:0 0 40px 40px; transition:all .25s; }

/* слёзные дорожки на щеках */
.stream { position:absolute; top:82px; width:7px; height:0; border-radius:4px;
  background:linear-gradient(#bfe9ff, rgba(150,210,255,0));
  opacity:0; transition:opacity .4s, height .4s; filter:blur(.5px); }
.stream.l { left:50px; } .stream.r { right:50px; }
#sun.crying .stream { opacity:1; height:40px; animation:streampulse .7s infinite; }
@keyframes streampulse { 0%,100%{opacity:.5} 50%{opacity:1} }

/* РАДОСТЬ */
#sun.happy #body { animation:jump .6s cubic-bezier(.3,1.6,.5,1); }
@keyframes jump { 0%,100%{transform:translateY(0) scale(1,1)} 30%{transform:translateY(-34px) scale(.92,1.1)} 55%{transform:translateY(0) scale(1.08,.9)} }
#sun.happy #mouth { width:46px; height:20px; }
#sun.happy .cheek { opacity:1; background:rgba(255,110,90,.65); }
#sun.joy #body { animation:spinjump 1.3s cubic-bezier(.3,1.4,.5,1); }
@keyframes spinjump { 0%,100%{transform:translateY(0) rotateY(0) scale(1)} 40%{transform:translateY(-38px) rotateY(180deg) scale(1.05)} 70%{transform:translateY(0) rotateY(360deg)} }
#sun.joy #mouth { width:50px; height:22px; }
#sun.joy .cheek { opacity:1; background:rgba(255,110,90,.7); }

/* ГЛАЖЕНИЕ */
#sun.pet .ball { transform:rotateY(-8deg) scale(.94); }
#sun.pet #mouth { width:44px; height:18px; }

/* ОБИДА */
#sun.offended .face { transform:translateX(-10px) rotate(-5deg); }
#sun.offended .brow { opacity:1; }
#sun.offended .brow.l { transform:rotate(22deg); } #sun.offended .brow.r { transform:rotate(-22deg); }
#sun.offended .eye { height:8px; border-radius:3px 3px 7px 7px; }
#sun.offended #mouth { width:20px; height:9px; border-bottom:none; border-radius:40px 40px 0 0; }
#sun.offended #body { animation:swayoff 2.4s infinite ease-in-out; }
@keyframes swayoff { 0%,100%{transform:rotate(-4deg)} 50%{transform:rotate(4deg)} }
#sun.offended #rays { opacity:.3; }
#sun.offended .cheek { opacity:.2; }

/* ЗЛОСТЬ: краснеет, трясётся, пыхтит паром */
#sun.angry .ball {
  background:radial-gradient(circle at 33% 26%, #ffd9c0 0%, #ff9b6a 22%, #f4552a 55%, #a8260c 92%);
  box-shadow:0 18px 40px rgba(0,0,0,.4), 0 0 70px 26px rgba(255,70,30,.55),
             0 0 150px 60px rgba(200,40,10,.25),
             inset -20px -24px 44px rgba(90,10,0,.55), inset 12px 14px 30px rgba(255,210,170,.4);
}
#sun.angry .eye { height:8px; border-radius:3px 3px 7px 7px; }
#sun.angry .brow { opacity:1; }
#sun.angry .brow.l { transform:rotate(-24deg); } #sun.angry .brow.r { transform:rotate(24deg); }
#sun.angry #mouth { width:26px; height:10px; border-bottom:none; border-radius:40px 40px 0 0; top:106px; }
#sun.angry .cheek { background:rgba(255,50,20,.85); animation:pulse .8s infinite; }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.5)} }
#sun.angry #body { animation:ragewobble .45s infinite; }
@keyframes ragewobble { 0%,100%{transform:translateX(-6px) rotate(-3deg)} 50%{transform:translateX(6px) rotate(3deg)} }
.steamfx { position:fixed; font-size:22px; pointer-events:none; z-index:70; animation:steamup 1.2s ease-out forwards; }
@keyframes steamup { 0%{opacity:0; transform:translateY(0) scale(.5)} 25%{opacity:1} 100%{opacity:0; transform:translateY(-70px) scale(1.3)} }

/* ПЛАЧ: синеет, глаза-дужки, всхлипы, слёзы потоком */
#sun.crying .ball {
  background:radial-gradient(circle at 33% 26%, #e2efff 0%, #a8c8ec 25%, #6f9cc9 60%, #43608a 95%);
  box-shadow:0 18px 40px rgba(0,0,0,.4), 0 0 50px 16px rgba(130,180,240,.4),
             inset -20px -24px 44px rgba(20,40,80,.5), inset 12px 14px 30px rgba(255,255,255,.3);
}
#sun.crying .ray { background:linear-gradient(to top,#9fc0e8,rgba(150,190,240,0)); opacity:.45; }
#sun.crying .eye { width:16px; height:9px; background:transparent; border:4px solid #23415f; border-bottom:none; border-radius:60% 60% 0 0; }
#sun.crying .brow { opacity:1; }
#sun.crying .brow.l { transform:rotate(-18deg) translateY(-4px); } #sun.crying .brow.r { transform:rotate(18deg) translateY(-4px); }
#sun.crying #mouth { width:20px; height:16px; border:4px solid #23415f; border-radius:0 0 30px 30px; animation:sobmouth .3s infinite; }
@keyframes sobmouth { 0%,100%{height:12px} 50%{height:20px} }
#sun.crying .cheek { opacity:.3; }
#sun.crying #body { animation:sob .55s infinite; }
@keyframes sob { 0%,100%{transform:translateY(0) rotate(0)} 30%{transform:translateY(3px) rotate(-2deg)} 70%{transform:translateY(3px) rotate(2deg)} }
#sun.crying .face { transform:rotate(-3deg); }
.tearfx { position:fixed; width:12px; height:16px; pointer-events:none; z-index:70;
  background:radial-gradient(circle at 35% 25%, #e4f6ff, #6ec3ff);
  border-radius:50% 50% 60% 60%; box-shadow:0 0 12px rgba(120,200,255,.95);
  animation:tearfall 1.5s ease-in forwards; }
@keyframes tearfall { 0%{opacity:0; transform:translateY(0) scale(.4)} 15%{opacity:1; transform:scale(1)} 100%{opacity:0; transform:translateY(120px) scale(1.05)} }

/* ВЫХОД ИЗ ПЛАЧА: хлюпает носом, улыбается сквозь слёзы */
#sun.recover .ball { background:radial-gradient(circle at 33% 26%, #fff0e0 0%, #ffdfa0 25%, #ffc85c 60%, #eb9c2c 95%); }
#sun.recover .cheek { opacity:1; background:rgba(255,140,140,.55); transform:scale(1.2); }
#sun.recover #mouth { width:30px; height:12px; }
#sun.recover #body { animation:sniff 1.1s infinite; }
@keyframes sniff { 0%,100%{transform:translateY(0)} 40%{transform:translateY(2px) scale(1.02)} 60%{transform:translateY(0) scale(.99)} }

/* СМЕХ: глаза-дужки, трясётся, летят 😂 */
#sun.laugh .eye { width:16px; height:9px; background:transparent; border:4px solid #6b2f00; border-bottom:none; border-radius:60% 60% 0 0; }
#sun.laugh #mouth { width:34px; height:26px; border-radius:0 0 60px 60px; animation:sobmouth .25s infinite; }
#sun.laugh .cheek { opacity:1; background:rgba(255,110,90,.7); }
#sun.laugh #body { animation:shake .3s infinite; }
@keyframes shake { 0%,100%{transform:translateX(-4px) rotate(-2deg)} 50%{transform:translateX(4px) rotate(2deg)} }

/* УДИВЛЕНИЕ: глаза огромные, рот «О», отшатывается */
#sun.surprised .eye { transform:scale(1.7); }
#sun.surprised .brow { opacity:1; transform:translateY(-6px); }
#sun.surprised #mouth { width:18px; height:18px; border:4px solid #6b2f00; border-radius:50%; top:100px; }
#sun.surprised #body { animation:jerkback .5s ease-out; }
@keyframes jerkback { 0%{transform:scale(1)} 35%{transform:scale(.86) translateY(6px)} 70%{transform:scale(1.06)} 100%{transform:scale(1)} }

/* ИСПУГ: бледнеет, мелко дрожит */
#sun.scared .ball { background:radial-gradient(circle at 33% 26%, #fdfdff 0%, #d8e2ee 25%, #a9b8cb 60%, #7d8aa0 95%); }
#sun.scared .eye { transform:scale(1.4); }
#sun.scared .brow { opacity:1; transform:translateY(-6px) rotate(-6deg); }
#sun.scared .brow.r { transform:translateY(-6px) rotate(6deg); }
#sun.scared #mouth { width:16px; height:14px; border:4px solid #444; border-radius:0 0 30px 30px; }
#sun.scared #body { animation:tremble .12s infinite; }
@keyframes tremble { 0%,100%{transform:translateX(-1.5px)} 50%{transform:translateX(1.5px)} }

/* СТИДЛИВОСТЬ: розовеет, косится, любит сердечки */
#sun.shy .ball { background:radial-gradient(circle at 33% 26%, #ffe8ee 0%, #ffb8c6 25%, #f7889f 60%, #d95f80 95%); }
#sun.shy .cheek { opacity:1; width:26px; height:16px; background:rgba(255,60,90,.65); transform:scale(1.3); }
#sun.shy .eye { transform:translate(4px,3px); height:14px; }
#sun.shy #mouth { width:22px; height:10px; }

/* СКУКА: полуприкрытые глаза, всё обвисло */
#sun.bored .eye { height:9px; }
#sun.bored #mouth { width:24px; height:4px; border:4px solid #6b2f00; border-bottom:none; border-radius:4px; top:110px; }
#sun.bored #body { animation:droop 2.6s infinite ease-in-out; }
@keyframes droop { 0%,100%{transform:translateY(4px) scale(.98)} 50%{transform:translateY(8px) scale(.96)} }

/* КУШАНИЕ */
.choco { position:absolute; top:-48px; left:50%; font-size:36px; opacity:0; transition:opacity .4s;
  pointer-events:none; animation:sway 1s infinite ease-in-out; }
@keyframes sway { 0%,100%{transform:translateX(-50%) rotate(-14deg)} 50%{transform:translateX(-50%) rotate(14deg)} }
#sun.eating .choco { opacity:1; }
#sun.eating .eye { height:4px; border-radius:3px; }
#sun.eating #mouth { animation:chew .35s infinite; }
@keyframes chew { 0%,100%{height:8px; width:26px} 50%{height:20px; width:34px} }
#sun.eating .cheek { opacity:1; transform:scale(1.45); }
#sun.eating #body { animation:lean 1s infinite ease-in-out; }
@keyframes lean { 0%,100%{transform:rotate(-6deg)} 50%{transform:rotate(6deg)} }

/* МЫСЛИ */
#sun.thinking .eye { transform:translateY(-4px); }
#sun.thinking #body { animation:look 3s infinite ease-in-out; }
@keyframes look { 0%,100%{transform:rotateY(-16deg)} 50%{transform:rotateY(16deg)} }
.thought { position:absolute; top:-34px; left:-26px; font-size:30px; opacity:0; transition:opacity .3s; }
#sun.thinking .thought { opacity:1; animation:bob 1.2s infinite ease-in-out; }
@keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

/* СОН */
#sun.sleeping .eye { height:5px; border-radius:3px; }
#sun.sleeping #body { animation:breath 3.5s ease-in-out infinite; }
@keyframes breath { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
.zzz { position:absolute; top:-4px; right:-16px; font-size:22px; opacity:0; }
#sun.sleeping .zzz { animation:zzz 2s infinite; }
@keyframes zzz { 0%{transform:translateY(0) scale(.6); opacity:0} 30%{opacity:1} 100%{transform:translateY(-42px) scale(1.2); opacity:0} }

/* тень на «земле» */
.shadow { position:absolute; bottom:6px; width:130px; height:26px; border-radius:50%;
  background:radial-gradient(ellipse, rgba(0,0,0,.5), rgba(0,0,0,0) 70%);
  filter:blur(7px); transform:translateX(-50%);
  animation:shadowpulse 4.2s ease-in-out infinite; }
@keyframes shadowpulse { 0%,100%{transform:translateX(-50%) scale(1); opacity:.55} 50%{transform:translateX(-50%) scale(.72); opacity:.3} }

/* сердечки, искры, смех */
.heart { position:fixed; pointer-events:none; z-index:80; animation:heartfly 1.7s ease-out forwards; }
@keyframes heartfly { 0%{opacity:0; transform:translateY(0) scale(.3) rotate(0)} 15%{opacity:1}
  100%{opacity:0; transform:translateY(-130px) translateX(var(--dx)) scale(1.35) rotate(var(--rot))} }
.spark { position:fixed; font-size:16px; pointer-events:none; z-index:80; animation:sparkfly .9s ease-out forwards; }
@keyframes sparkfly { 0%{opacity:1; transform:translate(0,0) scale(1)}
  100%{opacity:0; transform:translate(var(--dx),var(--dy)) scale(.2)} }
.lolfx { position:fixed; font-size:20px; pointer-events:none; z-index:80; animation:steamup 1.1s ease-out forwards; }

/* чат */
#chat { width:min(560px,92vw); height:44vh; overflow-y:auto; padding:16px;
  background:#17212b; border-radius:22px 22px 0 0;
  display:flex; flex-direction:column; gap:8px; }
.msg { max-width:68%; padding:9px 14px 6px; border-radius:16px; font-size:20px; line-height:1.4;
  animation:pop .35s cubic-bezier(.3,1.5,.5,1); }
.msg.sun  { align-self:flex-start; background:#2b5278; border-bottom-left-radius:6px; }
.msg.user { align-self:flex-end;   background:#4a7d4a; border-bottom-right-radius:6px; }
.msg .time { display:block; font-size:10px; color:rgba(255,255,255,.55); text-align:right; margin-top:2px; }
.typing { display:flex; gap:5px; padding:12px 16px; }
.typing span { width:8px; height:8px; background:#9ec5e8; border-radius:50%; animation:dot 1.2s infinite; }
.typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s}
@keyframes dot { 0%,60%,100%{transform:translateY(0); opacity:.4} 30%{transform:translateY(-6px); opacity:1} }
@keyframes pop { from{transform:scale(.4); opacity:0} to{transform:scale(1); opacity:1} }

#bar { width:min(560px,92vw); display:flex; gap:10px; padding:12px; background:#17212b; border-radius:0 0 22px 22px; }
#inp { flex:1; padding:13px 18px; border-radius:30px; border:1px solid rgba(255,255,255,.15);
  background:#223140; color:#fff; font-size:15px; outline:none; }
#inp::placeholder { color:rgba(255,255,255,.4) }
#btn { padding:12px 22px; border:none; border-radius:50%; font-size:17px;
  background:linear-gradient(135deg,#ffd97a,#f2951b); cursor:pointer; }
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<button class="ui" id="moonbtn">🌙</button>
<button class="ui" id="fsbtn">⛶</button>

<div id="scene">
  <div class="shadow" id="shadow"></div>
  <div id="sun">
    <div id="rays"></div>
    <div id="body">
      <div class="ball">
        <div class="crater c1"></div><div class="crater c2"></div><div class="crater c3"></div>
        <div class="face">
          <div class="brow l"></div><div class="brow r"></div>
          <div class="eye l"></div><div class="eye r"></div>
          <div class="stream l"></div><div class="stream r"></div>
          <div class="cheek l"></div><div class="cheek r"></div>
          <div id="mouth"></div>
        </div>
      </div>
      <div class="choco">🍫</div>
      <div id="zzz" class="zzz">💤</div>
      <div id="thought" class="thought">💭</div>
    </div>
  </div>
</div>

<div id="chat"></div>
<div id="bar">
  <input id="inp" placeholder="Сообщение..." autocomplete="off">
  <button id="btn">➤</button>
</div>

<script>
const scene=document.getElementById('scene'), sunEl=document.getElementById('sun'),
      shadow=document.getElementById('shadow'), chat=document.getElementById('chat'),
      inp=document.getElementById('inp');

/* лучи — все на одном держателе, смещаться не могут */
const rays=document.getElementById('rays');
for(let i=0;i<12;i++){
  const r=document.createElement('div'); r.className='ray';
  r.style.setProperty('--a',(i*30)+'deg');
  r.style.animationDelay=(-i*0.2)+'s';
  rays.appendChild(r);
}
/* звёзды */
const st=document.getElementById('stars');
for(let i=0;i<70;i++){
  const s=document.createElement('div'); s.className='star';
  const sz=Math.random()*2.2+1;
  s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${sz}px;height:${sz}px;animation-delay:${Math.random()*3}s`;
  st.appendChild(s);
}

/* ---------- позиция и перемещение ---------- */
let sx=0, sy=0;
function setPos(){
  sunEl.style.left=sx+'px'; sunEl.style.top=sy+'px';
  shadow.style.left=sx+'px';
}
function place(){
  const r=scene.getBoundingClientRect();
  sx=r.width/2; sy=r.height/2; setPos();
}
window.addEventListener('resize',place); place();

function scenePos(e){ const r=scene.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
function sunCenter(){ const r=sunEl.getBoundingClientRect(); return {x:r.left+r.width/2, y:r.top+r.height/2}; }

/* ---------- звук ---------- */
let AC=null;
function ac(){ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume(); return AC; }
function tone(f,d,type='sine',v=.16,f2){
  try{ const a=ac(),o=a.createOscillator(),g=a.createGain();
  o.type=type; o.frequency.value=f;
  if(f2)o.frequency.linearRampToValueAtTime(f2,a.currentTime+d);
  g.gain.setValueAtTime(v,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);
  o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime+d);}catch(e){}
}
function noise(d,v=.18,fc=1000){
  try{ const a=ac(),len=a.sampleRate*d,b=a.createBuffer(1,len,a.sampleRate),ch=b.getChannelData(0);
  for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);
  const s=a.createBufferSource(); s.buffer=b;
  const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=fc;
  const g=a.createGain(); g.gain.value=v;
  s.connect(f).connect(g).connect(a.destination); s.start();}catch(e){}
}
const S={
  chime(){ tone(660,.14); setTimeout(()=>tone(880,.18),110); setTimeout(()=>tone(1100,.22),220); },
  growl(){ tone(72,.5,'sawtooth',.28,45); tone(66,.5,'square',.12); },
  /* плач: три всхлипа подряд, потом икота */
  sob(){ for(let i=0;i<3;i++) setTimeout(()=>{ tone(520-i*80,.34,'sine',.22,280-i*50);
        setTimeout(()=>tone(300,.08,'sine',.12,200),360); }, i*560); },
  sniff(){ noise(.18,.1,700); },
  crunch(){ for(let i=0;i<5;i++) setTimeout(()=>noise(.09,.22,800+Math.random()*700),i*430); },
  purr(){ tone(46,.55,'sawtooth',.14,58); },
  blip(){ tone(740,.07,'square',.09); setTimeout(()=>tone(940,.09,'square',.09),90); },
  ding(){ tone(990,.18,'triangle',.14); },
  deep(){ tone(120,.8,'sine',.14,78); },
  gasp(){ noise(.35,.2,500); setTimeout(()=>tone(500,.15,'sine',.14,650),80); },
  laugh(){ for(let i=0;i<6;i++) setTimeout(()=>tone(560+((i%2)*140),.09,'square',.14),i*130); },
};

/* ---------- настроение ---------- */
let mood='neutral', moodTimer, steamTimer, tearTimer, sobTimer, idleTimer;
function setMood(m,ms){
  sunEl.className=m==='neutral'?'':m;
  mood=m;
  clearInterval(steamTimer); clearInterval(tearTimer); clearInterval(sobTimer);
  if(m==='angry'){ steamTimer=setInterval(spawnSteam,700); if(S.growl)S.growl(); }
  if(m==='crying'){
    dropTear(); dropTear();
    tearTimer=setInterval(dropTear,400);
    sobTimer=setInterval(()=>S.sob(),2400);
    S.sob();
    /* плач усиливается со временем — как у человека */
    setTimeout(()=>{ if(mood==='crying'){ clearInterval(tearTimer); tearTimer=setInterval(dropTear,210); } },4000);
  }
  if(m==='laugh'){ for(let i=0;i<7;i++) setTimeout(spawnLol, i*180); }
  if(m==='shy'){ heartBurst(3); }
  if(m==='recover'){ S.sniff(); if(!ms) ms=3200; }
  clearTimeout(moodTimer);
  if(ms) moodTimer=setTimeout(()=>{
    if(mood!==m) return;
    if(m==='crying'){ setMood('recover'); add('🥹💧','sun'); return; }
    setMood('neutral');
  }, ms);
}

/* ---------- частицы ---------- */
function fxAt(cls,txt){
  const c=sunCenter(), s=document.createElement('div');
  s.className=cls; s.textContent=txt;
  s.style.left=(c.x-30+Math.random()*60)+'px'; s.style.top=(c.y-95)+'px';
  document.body.appendChild(s); setTimeout(()=>s.remove(),1300);
}
function spawnSteam(){ fxAt('steamfx','💢'); }
function spawnLol(){ fxAt('lolfx',['😂','🤣','😹'][Math.floor(Math.random()*3)]); }
function dropTear(){
  const c=sunCenter(), side=Math.random()<.5?-1:1, t=document.createElement('div');
  t.className='tearfx';
  t.style.left=(c.x+side*34-6)+'px'; t.style.top=(c.y+2)+'px';
  document.body.appendChild(t); setTimeout(()=>t.remove(),1550);
}
function heartBurst(n){
  const c=sunCenter(), chars=['💛','❤️','💖','🧡'];
  for(let i=0;i<n;i++) setTimeout(()=>{
    const h=document.createElement('div'); h.className='heart'; h.textContent=chars[i%4];
    h.style.left=(c.x-16+Math.random()*32)+'px'; h.style.top=(c.y-46)+'px';
    h.style.setProperty('--dx',(Math.random()*90-45)+'px');
    h.style.setProperty('--rot',(Math.random()*60-30)+'deg');
    h.style.fontSize=(15+Math.random()*14)+'px';
    document.body.appendChild(h); setTimeout(()=>h.remove(),1750);
  },i*110);
}
function sparkBurst(){
  const c=sunCenter();
  for(let i=0;i<10;i++){
    const s=document.createElement('div'); s.className='spark'; s.textContent=['✨','⭐','💫'][i%3];
    const ang=Math.random()*Math.PI*2, d=50+Math.random()*60;
    s.style.left=c.x+'px'; s.style.top=c.y+'px';
    s.style.setProperty('--dx',Math.cos(ang)*d+'px');
    s.style.setProperty('--dy',Math.sin(ang)*d+'px');
    document.body.appendChild(s); setTimeout(()=>s.remove(),900);
  }
}

/* ---------- чат ---------- */
function now(){ const d=new Date(); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); }
function add(html,who){
  const m=document.createElement('div'); m.className='msg '+who;

  chat.appendChild(m); chat.scrollTop=chat.scrollHeight;
}
function addTyping(){

  m.innerHTML='<span></span><span></span><span></span>';

/* ---------- АНАЛИЗАТОР РЕЧИ ----------
   Солнышко «читает» каждое сообщение: ищет смыслы по словарю,
   считает тональность, замечает вопросы и восклицания.
   Ничего не пропускает: даже без прямых слов реагирует на настроение. */
const LEX={

  sorry:['прости','извин','виноват','сорян','сорри','простите','прошу прощения','извини'],
  sad:['плачь','плакат','заплачь','плачет','заплачет','плачу','плакал','слез','рыд','груст','печал','тоск','мне плохо','мне больно','больно','жалко','обидно','устал','нет сил','одинок','расстроен','депресс','плохое настроение','тяжело','хочу плакат','скучаю','умираю','все плохо','всё плохо','никто не любит','меня не любят','бесит','отвали','уныние','слёзы','слезки','ревеву','реву'],
  insult:['дурак','тупой','глупый','ненавиж','ненавиств','идиот','заткнись','отстань','урод','бесишь','кретин','ничтож','лузер','надоел','плохой','ненавиствую','тупица','убирайся','отвались'],
  love:['люблю','обожаю','ты лучший','ты классный','милый','милашка','симпатичный','красив','лапочка','ты хороший','нравишься','дорогой','родной'],
  thanks:['спасиб','благодар','пасиб','молодец','умниц','молодчин','круто сделал','благодарю'],
  laugh:['смешно','хаха','ахах','аха','лол','прикол','ржу','ржач','кек','орё','орю','хихи','гы','качалка','юмор'],
  surprise:['вау','ого','офиг','не может быть','серьёзно','серьезно','ничего себе','вот это да','ужас','кошмар','правда?','шок','невероятно'],
  fear:['страшно','боюсь','испуг','страх','пугает','страшн','жутко','мерещится'],
  bore:['скучно','скука','нудно','нечего делать','зануда'],
  food:['шоколад','конфет','кушать','голоден','голод','есть хочу','поесть','сладост','вкусн','печеньк','торт','конфетк','покушать'],
  greet:['привет','прив','хай','здравств','доброе утро','добрый день','добрый вечер','хеллоу','hello','хаюшки','ку '],
  howareyou:['как дела','как ты','что делаешь','как жизнь','как настроение','чем занят'],
  music:['музык','песн','мелоди'],
  game:['игр','играть','игра'],
  bye:['пока','до свидан','спокойной ночи','споки','бай','прощай','спать','усни','увидимся'],
};
const NEG=['плохо','злой','ненавист','боль','пла','груст','дурак','туп','ненавиж','отстал','страшно','устал','болит','тяжело','злой','стыдно','бесишь','злюсь','раздраж','ненавиств','печал','тоска','никогда'];
const POS=['хорошо','люблю','класс','супер','круто','молодец','спасибо','рад','счаст','ура','прекрасно','отлично','мило','нравишься','обожаю','весело','смешно','суперский','кайф'];
const PRIORITY=['sorry','sad','love','food','laugh','fear','surprise','greet','howareyou','thanks','bye','music','game','bore'];

let insultStreak=0;
function countHits(t,arr){ let n=0; for(const w of arr){ let i=0; while((i=t.indexOf(w,i))!==-1){ n++; i+=w.length; } } return n; }

function decide(text){
  const t=text.toLowerCase();
  /* 1. во время плача утешительные слова работают первыми */
  if(mood==='crying' && countHits(t,LEX.comfort)) return {cat:'comfort'};
  if(mood==='crying' && countHits(t,LEX.sorry)) return {cat:'comfort'};
  /* 2. ищем смыслы по словарю */
  let best=null,bestN=0;
  for(const cat of PRIORITY){
    const n=countHits(t,LEX[cat]);
    if(n>bestN){ best=cat; bestN=n; }
  }
  /* 3. оскорбления особые: злость → обида → слёзы, как у человека */
  const ins=countHits(t,LEX.insult);
  if(ins>0){
    insultStreak++;
    if(insultStreak>=2||mood==='angry'||ins>=2) return {cat:'broken'};
    return {cat:'angry'};
  }
  if(best==='sorry'||best==='love'){ insultStreak=0; }
  if(best) return {cat:best};
  /* 4. словарь молчит — включаем анализ тональности */
  const neg=countHits(t,NEG), pos=countHits(t,POS);
  if(t.includes('?')||/^(что|как|почему|когда|где|кто|зачем|сколько|какой|куда)\b/.test(t)) return {cat:'question'};
  if(neg>0) return {cat:'sad'};
  if(t.includes('!')) return {cat:'surprise'};
  if(pos>0) return {cat:'happy'};
  return {cat:'random'};
}

/* ---------- ответы ---------- */
const RESP={

  bore:[['😑','bored',8000,null],['😑💤','bored',8000,null]],

  game:[['🎮🕹',null,0,null],['🕹✨',null,0,null]],
  bye:[['😴🌙💤','sleeping',0,'deep'],['🌙😴💤','sleeping',0,'deep']],
  comfort:[['🥹🫂💧','recover',3200,'sniff'],['🥹💛💧','recover',3400,null]],
  question:[['🤔💭','thinking',1800,'blip'],['💭🤔','thinking',1800,'blip']],
  happy:[['😊✨','happy',2400,'chime'],['🌞🌟','happy',2400,'chime']],
  random:[['☀️✨',null,0,null],['😊',null,0,null],['🌟💛',null,0,null],['🌞🌞',null,0,null],['💫',null,0,null],['🥰☀️',null,0,null],['🌼✨',null,0,null],['💛🌞',null,0,null]],
};
function respond(text){
  const d=decide(text);
  if(mood==='crying'&&(d.cat==='greet'||d.cat==='howareyou')) return ['👋🥺💧',null,0,null];
  const arr=RESP[d.cat]||RESP.random;
  const r=arr[Math.floor(Math.random()*arr.length)];
  return r;
}
function sunSays(emo,m,ms,snd){
  sunEl.classList.add('thinking');
  const ty=addTyping();
  setTimeout(()=>{
    ty.remove(); sunEl.classList.remove('thinking');
    add(emo,'sun');
    if(snd&&S[snd])S[snd]();
    if(m) setMood(m,ms||3000);
  },500+Math.random()*400);
}

/* ---------- отправка ---------- */
function send(){
  const v=inp.value.trim(); if(!v)return;
  add(v,'user'); inp.value=''; wake();
  const [emo,m,ms,snd]=respond(v);
  if(m==='eating'){
    setMood('eating',4200); S.crunch();
    sunSays(emo,null,0,null);
    setTimeout(()=>{ if(mood==='eating'){ setMood('happy',2500); add('😋🍫','sun'); } },4400);
    return;
  }
  sunSays(emo,m,ms,snd);
}
document.getElementById('btn').onclick=send;
inp.addEventListener('keydown',e=>{ if(e.key==='Enter')send(); });

/* ---------- перемещение, гладение, клик ---------- */
let grab=null, moved=false;
scene.addEventListener('pointerdown',e=>{
  const p=scenePos(e);
  if(Math.hypot(p.x-sx,p.y-sy)<100){ grab={dx:p.x-sx,dy:p.y-sy}; moved=false; }
});
scene.addEventListener('pointermove',e=>{
  const p=scenePos(e);
  const over=Math.hypot(p.x-sx,p.y-sy)<100;
  if(grab){
    sx=Math.max(60,Math.min(scene.clientWidth-60,p.x-grab.dx));
    sy=Math.max(52,Math.min(scene.clientHeight-46,p.y-grab.dy));
    setPos(); moved=true;
  }
  if(over)pet();
});
window.addEventListener('pointerup',()=>{ if(grab&&!moved)tapSun(); grab=null; });

let lastPet=0,lastPurr=0,petStrokes=0,petCalm=0,petDecay;
function pet(){
  const t=Date.now();
  if(t-lastPet<130)return; lastPet=t;
  petStrokes++; clearTimeout(petDecay); petDecay=setTimeout(()=>petStrokes=0,1600);
  if(mood==='crying'){
    petCalm++;
    dropTear();
    if(petCalm>=4){
      petCalm=0; clearInterval(tearTimer); clearInterval(sobTimer);
      setMood('recover',3200); heartBurst(4); add('🥹🫂💛','sun');
    }
    return;
  }
  petCalm=0;
  sunEl.classList.add('pet'); setTimeout(()=>sunEl.classList.remove('pet'),220);
  if(t-lastPurr>850){ lastPurr=t; S.purr(); }
  heartBurst(1);
  if(mood==='sleeping'||mood==='offended'||mood==='bored') setMood('happy',1500);
  else if(mood!=='crying'&&mood!=='angry') setMood('happy',1500);
  if(petStrokes>=8){ petStrokes=0; heartBurst(8); setTimeout(()=>add('💕💛💖','sun'),250); }
  wake();
}
function tapSun(){
  wake();
  if(mood==='sleeping'){ setMood('neutral'); add('☀️❓','sun'); S.blip(); return; }
  if(mood==='angry'){ S.growl(); add('💢','sun'); return; }
  if(mood==='crying'){ S.sob(); dropTear(); dropTear(); return; }
  S.ding(); sparkBurst(); setMood('happy',900);
  add(['☀️✨','😊🌟','💛','🌞✨'][Math.floor(Math.random()*4)],'sun');
}

/* ---------- сон и скука ---------- */
function wake(){
  if(mood==='sleeping') setMood('neutral');
  clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>{
    if(mood==='offended'){ setMood('crying',12000); add('😭💧','sun'); return; }
    if(mood==='angry'||mood==='crying') return;
    add('🥱','sun'); S.deep();
    idleTimer=setTimeout(()=>{ setMood('sleeping'); add('💤','sun'); },25000);
  },20000);
}

/* ---------- моргание ---------- */
setInterval(()=>{
  if(mood==='sleeping'||mood==='crying'||mood==='eating'||mood==='laugh'||mood==='surprised'||mood==='scared')return;
  document.querySelectorAll('.eye').forEach(e=>e.classList.add('closed'));
  setTimeout(()=>document.querySelectorAll('.eye').forEach(e=>e.classList.remove('closed')),150);
  if(Math.random()<.25) setTimeout(()=>document.querySelectorAll('.eye').forEach(e=>{
    e.classList.add('closed'); setTimeout(()=>e.classList.remove('closed'),140);
  }),420);
},3400);

/* ---------- кнопки ---------- */
document.getElementById('fsbtn').onclick=()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
};
document.getElementById('moonbtn').onclick=function(){
  document.body.classList.toggle('night');
  const isMoon=document.body.classList.toggle('moon');
  this.textContent=isMoon?'☀️':'🌙';
  if(isMoon){ setMood('sleeping'); add('🌙💤','sun'); S.deep(); }
  else { setMood('happy',2500); heartBurst(4); add('☀️✨','sun'); S.chime(); }
  wake();
};

/* ---------- старт ---------- */
add('☀️✨','sun');
setTimeout(()=>{ setMood('happy',2200); heartBurst(4); },600);
wake();
